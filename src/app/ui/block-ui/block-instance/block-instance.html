<div
    class="block-instance"
    [style.left.px]="instance.position.x"
    [style.top.px]="instance.position.y"
    [style.z-index]="editorState.instanceZIndexs.get(instance.id) ?? 1"
    (pointerdown)="onFocus($event)"
>
    <div
        class="block-header"
        (pointerdown)="onHandleGrab($event)"
    >
        {{ block.id }}
    </div>

    <div
        class="block-body panzoom-exclude"
    >
        @for (row of rows; track row.id) {
            <div class="row">
                <div class="slot-container left">
                    @if (row.input) {
                        <div class="slot input-slot"></div>
                    }
                </div>

                <div class="row-content">
                    @if (row.param) {
                        <div class="param-ui">
                            {{ row.param.ui.type }}
                        </div>
                    }
                </div>
            </div>
        }
        <div class="outputs">
            @for (output of block.outputs; track output.id) {
                <div class="output-wrapper">
                    <div class="slot output-slot"></div>
                </div>
            }
        </div>
    </div>
</div>
