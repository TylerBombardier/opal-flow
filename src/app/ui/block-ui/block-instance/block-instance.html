<div
    class="block-instance"
    [style.left.px]="instance.position.x"
    [style.top.px]="instance.position.y"
    [style.z-index]="editorState.instanceZIndexs.get(instance.id) ?? 1"
    (pointerdown)="onFocus($event)"
    (contextmenu)="onContextMenu($event)"
>
    <div
        class="block-header"
        (pointerdown)="onHandleGrab($event)"
    >
        <span class="title">{{ block.displayName }}</span>
        <button
            class="delete-btn"
            (pointerdown)="onDeleteBtnPressed($event)"
        >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        </button>
    </div>

    <div
        class="block-body panzoom-exclude"
    >
        <div class="wrapper">
            <div>
                @for (row of rowInputs; track row.id) {

                    <div class="row-input">

                        @if (row.input) {
                            <app-input-slot
                                [instanceId]="instance.id"
                                [inputId]="row.input.id"
                            >
                            </app-input-slot>
                        }

                        <div class="container">
                            <div class="label">
                                {{ row.label }}
                            </div>

                            @if (row.param) {
                                <app-param-renderer
                                    [instance]="instance"
                                    [param]="row.param"
                                >
                                </app-param-renderer>
                            }

                        </div>

                    </div>

                }
            </div>
            
            <div class="output-bar">
                @for(output of block.outputs; track output.id){
                    <div class="row-output">
                        <div>
                            <div class="label">
                                {{ outputLabel(output) }}
                            </div>
                            <div class="cached-value">
                                {{ getOutputValue(output.id) }}
                            </div>
                        </div>
                        
                        <app-output-slot
                            [instanceId]="instance.id"
                            [outputId]="output.id"
                        >
                        </app-output-slot>
                    </div>
                    
                }
            </div>
        </div>
        
    </div>
</div>
