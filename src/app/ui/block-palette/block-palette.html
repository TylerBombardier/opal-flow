<div class="palette" [class.closed]="!isOpen">

    <div class="palette-header">

        <input
            class="search"
            type="text"
            placeholder="Search blocks..."
            [(ngModel)]="search"
        >

        <button 
            class="collapse-button"
            (click)="toggleTray()"
            [class.closed]="!isOpen"
        >
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="size-6">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </button>

    </div>

    <div class="palette-content">

        @for (
            group of groupedBlocks | keyvalue;
            track group.key
        ) {

            <div class="category" [class.closed]="!isCategoryOpen(group.key)">

                <div 
                    class="category-title"
                    (click)="toggleCategory(group.key)"
                >
                    {{ group.key }}
                </div>

                @if (isCategoryOpen(group.key)) {
                    @for (block of group.value; track block.id) {

                    <div class="block-item">
                        <div class="block-name">
                            {{ block.displayName ?? block.id }}
                        </div>

                        <div class="block-id">
                            {{ block.id }}
                        </div>
                    </div>

                    }
                }

                

            </div>

        }

    </div>

</div>
