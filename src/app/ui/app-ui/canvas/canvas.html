<div 
    class="canvas"
    [style.--grid-size.px]="editorState.gridSize"
>

    <div class="world" #world >

        <div
            class="grid"
        ></div>

        <svg class="wire-layer">
            @for (wire of wires; track wire.id) {
                <path></path>
            }
        </svg>

        @for (instance of instances; track instance.id) {
            <app-block-instance [instance]="instance">

            </app-block-instance>
        }
    </div>
</div>
