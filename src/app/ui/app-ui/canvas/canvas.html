<div 
    class="canvas"
    [style.--grid-size.px]="editorState.gridSize"
>
    @if(editorState.contextMenu.visible){
        <div
            class="context-menu"
            [style.left.px]="editorState.contextMenu.x"
            [style.top.px]="editorState.contextMenu.y"
        >
            <button>
                Run
            </button>
            <button>
                Delete
            </button>
        </div>
    }
    <div class="world" #world >

        <div
            class="grid"
        ></div>

        <svg class="wire-layer">
            @for (wire of wires; track wire.id) {
                <path [attr.d]="wireRenderer.renderWire(wire)" stroke="white" stroke-width="2"></path>
            }
            @if(this.editorState.activeWireDrag){
                <path [attr.d]="wireRenderer.renderPreviewWire()" stroke="white" stroke-width="2"></path>
            }
        </svg>

        @for (instance of instances; track instance.id) {
            <app-block-instance [instance]="instance">

            </app-block-instance>
        }
    </div>
</div>
